scheduler:
  asset-expiration:
    cron: '0 0 0 * * *'
    lock-at-most-for: 'PT1H'
integration:
  json-schema:
    connectTimeout: 5
    readTimeout: 30
  party:
    connectTimeout: 5
    readTimeout: 30
  relation:
     connectTimeout: 5
     readTimeout: 30
logging:
  level:
    root: 'INFO'
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
resilience4j:
  circuitbreaker:
    instances:
      # A concurrent update is a client condition, not a downstream fault. Left to count as a failure it would open the
      # breaker and turn 409 into 503 for callers who never collided with anyone.
      assetAttachmentRepository:
        ignoreExceptions: org.springframework.dao.OptimisticLockingFailureException
      assetRepository:
        ignoreExceptions: org.springframework.dao.OptimisticLockingFailureException
      json-schema:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      party:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
spring:
  application:
    name: api-partyassets
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          json-schema:
            authorization-grant-type: client_credentials
            provider: json-schema
          party:
            authorization-grant-type: client_credentials
            provider: party
          relation:
            authorization-grant-type: client_credentials
            provider: relation
          pr3import-messaging:
            authorization-grant-type: client_credentials
            provider: pr3import-messaging
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

