  /{municipalityId}/assets:
    get:
      tags:
      - Assets
      summary: Get assets
      operationId: getAssets
      parameters:
      - name: municipalityId
        in: path
        description: Municipality ID
        required: true
        schema:
          type: string
        example: 2281
      - name: assetId
        in: query
        description: External asset id (e.g. PRH-123456789) used as an identifier
          by external systems
        required: false
        schema:
          type: string
          description: External asset id (e.g. PRH-123456789) used as an identifier
            by external systems
          examples:
          - PRH-123456789
      - name: origin
        in: query
        description: Source of origin for the asset
        required: false
        schema:
          type: string
          description: Source of origin for the asset
          examples:
          - CASEDATA
      - name: partyId
        in: query
        description: PartyId
        required: true
        schema:
          type: string
          description: PartyId
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
      - name: type
