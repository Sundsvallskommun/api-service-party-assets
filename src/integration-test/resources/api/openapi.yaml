  /{municipalityId}/assets/search:
    get:
      tags:
      - Assets
      summary: Search assets
      description: "Returns a page of the assets in the municipality that match the\
        \ filter, whatever their status (including DRAFT). The filter refers to the\
        \ attribute names of the asset model. Paging is one-based, and the assets\
        \ are sorted by created unless sortBy is given."
      operationId: searchAssets
      parameters:
      - name: municipalityId
        in: path
        description: Municipality ID
        required: true
        schema:
          type: string
        example: 2281
      - name: filter
        in: query
        description: "Part of the [spring-filter](https://github.com/turkraft/spring-filter/blob/85730f950a5f8623159cc0eb4d737555f9382bb7/README.md#syntax)\
          \ syntax: conditions with an attribute of the asset model on the left and\
          \ quoted values on the right, using :, !, >, >:, <, <:, between, in, not\
          \ in, is null and is not null, ~ and ~~ with one pattern on text attributes,\
          \ is empty and is not empty on additionalParameters and jsonParameters,\
          \ and exists(...), combined with and, or, not and parentheses. Dates are\
          \ written in ISO 8601, such as 2027-01-01 and 2026-11-01T00:00:00+01:00."
        required: false
        schema:
          type: string
        example: type:'AlcoholServingPermit' and status:'ACTIVE' and validTo < '2027-01-01'
      - name: sortBy
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            description: The properties to sort on
            examples:
            - propertyName
      - name: sortDirection
        in: query
        description: The sort order direction
        required: false
        schema:
          $ref: "#/components/schemas/Direction"
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          description: Page number
          examples:
          - 1
          minimum: 1
      - name: limit
        in: query
        description: Result size per page. Maximum allowed value is dynamically configured
        required: false
        schema:
          type: integer
          format: int32
          description: Result size per page. Maximum allowed value is dynamically
            configured
          examples:
          - 15
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPagedResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api-docs:
    get:
      tags:
      - API
      summary: OpenAPI
      operationId: getApiDocs
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema:
                type: string
      x-auth-type: None
      x-throttling-tier: Unlimited
      x-wso2-mutual-ssl: Optional
components:
  schemas:
    Status:
      type: string
      description: Status model
      enum:
      - ACTIVE
      - DRAFT
      - EXPIRED
      - BLOCKED
      - TEMPORARY
      - REPLACED
      - REVOKED
    Problem:
      type: object
      properties:
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        detail:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
    ConstraintViolationProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
        title:
          type: string
        instance:
          type: string
          format: uri
        detail:
          type: string
    Violation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    AssetCreateRequest:
      type: object
      properties:
        assetId:
          type: string
          description: External asset id (e.g. PRH-123456789) used as an identifier
            by external systems
          examples:
          - PRH-123456789
        origin:
          type: string
          description: Source of origin for the asset
          examples:
          - CASEDATA
        partyId:
          type: string
          description: PartyId
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        type:
          type: string
          description: Asset type
          examples:
          - PERMIT
          minLength: 1
        issued:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
        validTo:
          type: string
          format: date
          description: Valid to date
          examples:
          - 2021-12-31
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
        statusReason:
          type: string
          description: Status reason
          examples:
          - Status reason
        description:
          type: string
          description: Asset description
          examples:
          - Asset description
        title:
          type: string
          description: "Asset title, shown to the party"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
          maxLength: 255
          minLength: 0
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: Additional parameters
          examples:
          - foo: bar
        jsonParameters:
          type: array
          description: JSON parameters
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
      required:
      - issued
      - partyId
      - status
      - type
    AssetJsonParameter:
      type: object
      properties:
        key:
          type: string
          description: Parameter key
          examples:
          - personParameter
          minLength: 1
        value:
          $ref: "#/components/schemas/JsonNode"
          description: Parameter value with the JSON structure
          example:
            firstName: Joe
            lastName: Doe
        schemaId:
          type: string
          description: Schema ID
          examples:
          - person_1.0
          minLength: 1
      required:
      - key
      - schemaId
      - value
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        array:
          type: boolean
        "null":
          type: boolean
        object:
          type: boolean
        float:
          type: boolean
        container:
          type: boolean
        number:
          type: boolean
        double:
          type: boolean
        long:
          type: boolean
        boolean:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        binary:
          type: boolean
        short:
          type: boolean
        pojo:
          type: boolean
        int:
          type: boolean
        string:
          type: boolean
        nodeType:
          type: string
          enum:
          - ARRAY
          - BINARY
          - BOOLEAN
          - MISSING
          - "NULL"
          - NUMBER
          - OBJECT
          - POJO
          - STRING
        floatingPointNumber:
          type: boolean
        bigInteger:
          type: boolean
        valueNode:
          type: boolean
        bigDecimal:
          type: boolean
        integralNumber:
          type: boolean
        missingNode:
          type: boolean
        embeddedValue:
          type: boolean
    AssetUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
        statusReason:
          type: string
          description: "Reason for the status, set together with it. A status sent without a reason clears the reason the asset had"
          examples:
          - Status reason
        validTo:
          type: string
          format: date
          description: Valid to date. Can only be changed while the asset is ACTIVE
            or TEMPORARY
          examples:
          - 2021-12-31
        indefinitely:
          type: boolean
          description: "If true, validTo will be cleared (asset becomes indefinite).\
            \ Takes precedence over validTo when both are supplied. Can only be used\
            \ while the asset is ACTIVE or TEMPORARY"
          examples:
          - true
        title:
          type: string
          description: "Asset title, shown to the party. Can only be changed while\
            \ the asset is ACTIVE or TEMPORARY"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
          maxLength: 255
          minLength: 0
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: "Additional parameters, replacing the current ones. Can only\
            \ be changed while the asset is ACTIVE or TEMPORARY"
          examples:
          - foo: bar
        jsonParameters:
          type: array
          description: "JSON parameters, replacing the current ones. Can only be changed\
            \ while the asset is ACTIVE or TEMPORARY"
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
    AssetAttachmentUpdateRequest:
      type: object
      description: Attachment update request. Null values are left untouched
      properties:
        fileName:
          type: string
          description: Name of the file
          examples:
          - lokalritning.pdf
          maxLength: 255
          minLength: 0
        category:
          type: string
          description: What the attachment depicts
          examples:
          - LOKALRITNING
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: Attachment description
          examples:
          - "Ritning over serveringslokal, plan 2"
          maxLength: 255
          minLength: 0
    AssetAttachment:
      type: object
      description: Metadata for a file attached to an asset
      properties:
        id:
          type: string
          description: Unique id of attachment
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
          readOnly: true
        fileName:
          type: string
          description: Name of the file
          examples:
          - lokalritning.pdf
        mimeType:
          type: string
          description: Mime type of the file
          examples:
          - application/pdf
          readOnly: true
        fileSize:
          type: integer
          format: int32
          description: Size of the file in bytes
          examples:
          - 1024
          readOnly: true
        category:
          type: string
          description: What the attachment depicts
          examples:
          - LOKALRITNING
        description:
          type: string
          description: Attachment description
          examples:
          - "Ritning over serveringslokal, plan 2"
        created:
          type: string
          format: date-time
          description: Timestamp when the attachment was created
          examples:
          - 2023-01-01T12:00:00+01:00
          readOnly: true
        updated:
          type: string
          format: date-time
          description: Timestamp when the attachment was last updated
          examples:
          - 2023-01-02T12:00:00+01:00
          readOnly: true
    DraftAssetUpdateRequest:
      type: object
      properties:
        issued:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
        validTo:
          type: string
          format: date
          description: Valid to date
          examples:
          - 2021-12-31
        indefinitely:
          type: boolean
          description: "If true, validTo will be cleared (asset becomes indefinite).\
            \ Takes precedence over validTo when both are supplied."
          examples:
          - true
        status:
          $ref: "#/components/schemas/Status"
          description: "Asset status. DRAFT keeps the asset a draft and ACTIVE activates it; no other status is accepted"
          examples:
          - ACTIVE
        statusReason:
          type: string
          description: "Reason for the status, set together with it. A status sent without a reason clears the reason the asset had"
          examples:
          - Status reason
        title:
          type: string
          description: "Asset title, shown to the party"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
          maxLength: 255
          minLength: 0
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: Additional parameters
          examples:
          - foo: bar
        jsonParameters:
          type: array
          description: JSON parameters
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
    Asset:
      type: object
      properties:
        id:
          type: string
          description: Unique id of asset
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
        assetId:
          type: string
          description: External asset id (e.g. PRH-123456789) used as an identifier
            by external systems
          examples:
          - PRH-123456789
        origin:
          type: string
          description: Source of origin for the asset
          examples:
          - CASEDATA
        partyId:
          type: string
          description: PartyId
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        type:
          type: string
          description: Asset type
          examples:
          - PERMIT
        issued:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
        validTo:
          type: string
          format: date
          description: Valid to date
          examples:
          - 2021-12-31
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
        statusReason:
          type: string
          description: Status reason
          examples:
          - Status reason
        description:
          type: string
          description: Asset description
          examples:
          - Asset description
        title:
          type: string
          description: "Asset title, shown to the party"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: Additional parameters
          examples:
          - foo: bar
        jsonParameters:
          type: array
          description: JSON parameters
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
        replacesId:
          type: string
          description: Id of the asset this asset replaces
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
        created:
          type: string
          format: date-time
          description: When the asset was created
          examples:
          - 2021-01-01T12:00:00+01:00
          readOnly: true
        updated:
          type: string
          format: date-time
          description: When the asset was last updated
          examples:
          - 2021-06-01T12:00:00+02:00
          readOnly: true
    AssetRevision:
      type: object
      description: An asset as it looked at one point in its history. The newest revision
        is the asset as it is now
      properties:
        id:
          type: string
          description: Unique id of the asset this revision belongs to
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
          readOnly: true
        revision:
          type: integer
          format: int32
          description: "Revision number. Numbering starts at 0, which is the asset\
            \ as it was created, and increases by one for every recorded change"
          examples:
          - 2
          readOnly: true
        actor:
          type: string
          description: "Who created this revision, taken from the X-Sent-By header.\
            \ Null when the header was absent, and for revisions written by the nightly\
            \ expiration job"
          examples:
          - joe01doe
          readOnly: true
        recordedAt:
          type: string
          format: date-time
          description: "When this revision was superseded, or when the asset was last\
            \ changed for the current revision"
          examples:
          - 2023-01-02T12:00:00+01:00
          readOnly: true
        assetId:
          type: string
          description: External asset id (e.g. PRH-123456789) used as an identifier
            by external systems
          examples:
          - PRH-123456789
          readOnly: true
        origin:
          type: string
          description: Source of origin for the asset
          examples:
          - CASEDATA
          readOnly: true
        partyId:
          type: string
          description: PartyId
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
        type:
          type: string
          description: Asset type
          examples:
          - PERMIT
          readOnly: true
        issued:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
          readOnly: true
        validTo:
          type: string
          format: date
          description: Valid to date
          examples:
          - 2021-12-31
          readOnly: true
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
          readOnly: true
        statusReason:
          type: string
          description: Status reason
          examples:
          - Status reason
          readOnly: true
        description:
          type: string
          description: Asset description
          examples:
          - Asset description
          readOnly: true
        title:
          type: string
          description: "Asset title, shown to the party"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
          readOnly: true
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: Additional parameters
          examples:
          - foo: bar
          readOnly: true
        jsonParameters:
          type: array
          description: JSON parameters
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
          readOnly: true
        replacesId:
          type: string
          description: Id of the asset this asset replaces
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
          readOnly: true
        attachments:
          type: array
          description: "Attachment metadata as it was at this revision. The files\
            \ themselves never change, so each one is still downloadable by its id\
            \ even if it has since been removed"
          items:
            $ref: "#/components/schemas/AssetAttachment"
          readOnly: true
    Direction:
      type: string
      description: The sort order direction
      enum:
      - ASC
      - DESC
      examples:
      - ASC
    AssetPagedResponse:
      type: object
      description: Paged asset response
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
            readOnly: true
        _meta:
          $ref: "#/components/schemas/PagingAndSortingMetaData"
          readOnly: true
    PagingAndSortingMetaData:
      type: object
      description: PagingAndSortingMetaData model
      properties:
        page:
          type: integer
          format: int32
          description: Current page
          examples:
          - 5
          readOnly: true
        limit:
          type: integer
          format: int32
          description: Displayed objects per page
          examples:
          - 20
          readOnly: true
        count:
          type: integer
          format: int32
          description: Displayed objects on current page
          examples:
          - 13
          readOnly: true
        totalRecords:
          type: integer
          format: int64
          description: Total amount of hits based on provided search parameters
          examples:
          - 98
          readOnly: true
        totalPages:
          type: integer
          format: int32
          description: Total amount of pages based on provided search parameters
          examples:
          - 23
          readOnly: true
        sortBy:
          type: array
          items:
            type: string
            description: The properties to sort by
            examples:
            - property
            readOnly: true
        sortDirection:
          $ref: "#/components/schemas/Direction"
          description: The sort order direction
          examples:
          - ASC
  securitySchemes: {}
