        description: Asset type
        required: false
        schema:
          type: string
          description: Asset type
          examples:
          - PERMIT
      - name: issued
        in: query
        description: Issued date
        required: false
        schema:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
      - name: validTo
        in: query
        description: Valid to date
        required: false
        schema:
          type: string
          format: date
          description: Valid to date
          examples:
