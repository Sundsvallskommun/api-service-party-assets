        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
      - Asset attachments
      summary: Create an asset attachment
      operationId: createAttachment
      parameters:
      - name: municipalityId
        in: path
        description: Municipality ID
        required: true
        schema:
          type: string
        example: 2281
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  format: binary
                category:
                  type: string
                  description: What the attachment depicts
                  maxLength: 255
                  minLength: 0
                description:
                  type: string
                  description: Attachment description
                  maxLength: 255
                  minLength: 0
                replaces:
                  type: string
                  description: "Id of an attachment this one replaces. The replaced\
                    \ attachment is removed from the asset but kept in its revision\
                    \ history, and its category and description are carried over unless\
                    \ new ones are given"
              required:
              - attachment
        required: true
      responses:
        "201":
          description: Created - Successful operation
          headers:
            Location:
              description: Location of the created resource.
              style: simple
              schema:
                type: string
        "409":
          description: Conflict - The asset was updated by someone else
          content:
